name: Build iOS App

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - main
  release:
    types: [created]

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Verify Node.js version
      run: |
        echo "Checking Node.js version..."
        node --version
        npm --version
        NODE_VERSION=$(node --version | cut -d'v' -f2 | cut -d'.' -f1)
        if [ "$NODE_VERSION" -lt 20 ]; then
          echo "ERROR: Node.js version must be >= 20.0.0, but got $(node --version)"
          exit 1
        fi
        echo "✓ Node.js version check passed: $(node --version)"
    
    - name: Install dependencies
      run: |
        node --version
        npm ci
    
    - name: Build web assets
      run: |
        node --version
        npm run build:web
    
    - name: Verify Node.js before Capacitor
      run: |
        echo "Current Node.js version:"
        node --version
        echo "Required: >= 20.0.0"
        node --version | grep -q "v2[0-9]" || (echo "Node.js version must be >= 20.0.0" && exit 1)
    
    - name: Sync Capacitor
      run: |
        node --version
        npx cap sync ios
    
    - name: Install CocoaPods
      run: |
        sudo gem install cocoapods
        
    - name: Install CocoaPods dependencies
      working-directory: ios/App
      run: |
        pod install --repo-update || pod install
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.1'
    
    - name: List available SDKs
      working-directory: ios/App
      run: |
        echo "Available iOS SDKs:"
        xcodebuild -showsdks | grep iphoneos || true
        echo ""
        echo "Available destinations:"
        xcodebuild -workspace App.xcworkspace -scheme App -showdestinations || true
    
    - name: Build iOS Archive
      working-directory: ios/App
      run: |
        # Clean build folder
        rm -rf build
        
        # Find available iOS SDK version (get the version number from the SDK list)
        echo "=== Listing all available SDKs ==="
        xcodebuild -showsdks
        
        echo ""
        echo "=== Extracting iOS SDK version ==="
        # Get all iOS SDKs and extract version numbers
        SDK_LINES=$(xcodebuild -showsdks | grep "iphoneos")
        echo "Found SDK lines:"
        echo "$SDK_LINES"
        
        # Extract version number from the first available SDK (e.g., "18.0" from "iphoneos18.0")
        # Try multiple patterns to extract the version
        AVAILABLE_SDK=$(echo "$SDK_LINES" | head -1 | grep -oE 'iphoneos[0-9]+\.[0-9]+' | sed 's/iphoneos//' | head -1)
        
        # If still not found, try simpler pattern
        if [ -z "$AVAILABLE_SDK" ]; then
          AVAILABLE_SDK=$(echo "$SDK_LINES" | head -1 | sed -n 's/.*iphoneos\([0-9.]*\).*/\1/p' | head -1)
        fi
        
        # If still not found, try without the dot
        if [ -z "$AVAILABLE_SDK" ]; then
          AVAILABLE_SDK=$(echo "$SDK_LINES" | head -1 | grep -oE 'iphoneos[0-9]+' | sed 's/iphoneos//' | head -1)
        fi
        
        echo "Extracted SDK version: '$AVAILABLE_SDK'"
        
        # Use the available SDK explicitly - MUST specify version to avoid defaulting to 18.1
        if [ -n "$AVAILABLE_SDK" ] && [ "$AVAILABLE_SDK" != "" ]; then
          SDK_ARG="-sdk iphoneos${AVAILABLE_SDK}"
          echo "Using SDK: $SDK_ARG"
        else
          echo "ERROR: Could not detect available iOS SDK version!"
          echo "Available SDKs:"
          xcodebuild -showsdks | grep iphoneos
          exit 1
        fi
        DEPLOYMENT_TARGET="14.0"
        
        echo "SDK argument: $SDK_ARG"
        echo "Deployment target: $DEPLOYMENT_TARGET"
        
        # Build for generic iOS device (no signing required for basic build)
        # Use available SDK but keep deployment target at 14.0 (project minimum)
        xcodebuild -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          $SDK_ARG \
          IPHONEOS_DEPLOYMENT_TARGET="$DEPLOYMENT_TARGET" \
          -destination 'generic/platform=iOS' \
          -archivePath build/App.xcarchive \
          archive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGN_STYLE="Manual" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          PROVISIONING_PROFILE_SPECIFIER="" \
          DEVELOPMENT_TEAM="" || {
            echo "Archive build failed, trying build without archive..."
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              $SDK_ARG \
              IPHONEOS_DEPLOYMENT_TARGET="$DEPLOYMENT_TARGET" \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/DerivedData \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_STYLE="Manual" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          }
    
    - name: Export IPA
      working-directory: ios/App
      run: |
        # Create a simpler export options for unsigned builds
        cat > ExportOptionsUnsigned.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
        </dict>
        </plist>
        EOF
        
        xcodebuild -exportArchive \
          -archivePath build/App.xcarchive \
          -exportPath build \
          -exportOptionsPlist ExportOptionsUnsigned.plist \
          -allowProvisioningUpdates || echo "Export failed, trying alternative method"
        
        # Alternative: Create IPA manually from archive
        if [ ! -f build/*.ipa ]; then
          echo "Creating IPA manually..."
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r App.ipa Payload
          cd ..
        fi
    
    - name: Find IPA file
      id: find-ipa
      working-directory: ios/App
      run: |
        IPA_FILE=$(find build -name "*.ipa" | head -1)
        echo "ipa_path=$IPA_FILE" >> $GITHUB_OUTPUT
        echo "Found IPA: $IPA_FILE"
    
    - name: Copy IPA to releases folder
      run: |
        mkdir -p releases
        cp ios/App/build/*.ipa releases/danai-task-manager-ios.ipa || true
        ls -lh releases/
    
    - name: Upload IPA as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa
        path: ios/App/build/*.ipa
        retention-days: 30
    
    - name: Upload to releases folder
      if: github.event_name == 'push'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add releases/danai-task-manager-ios.ipa
        git commit -m "Add iOS IPA build [skip ci]" || exit 0
        git push origin main || exit 0
    
    - name: Create Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          releases/danai-task-manager-ios.ipa
          releases/danai-task-manager-android.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

