name: Build iOS App

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - 'ios/**'
      - 'package.json'
      - 'capacitor.config.ts'
  release:
    types: [created]

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build web assets
      run: npm run build:web
    
    - name: Sync Capacitor
      run: npx cap sync ios
    
    - name: Install CocoaPods dependencies
      working-directory: ios/App
      run: |
        pod install --repo-update
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
    
    - name: Build iOS Archive
      working-directory: ios/App
      run: |
        xcodebuild -workspace App.xcworkspace \
          -scheme App \
          -configuration Release \
          -archivePath build/App.xcarchive \
          -allowProvisioningUpdates \
          archive \
          CODE_SIGN_IDENTITY="Apple Development" \
          DEVELOPMENT_TEAM="" \
          CODE_SIGN_STYLE="Automatic"
    
    - name: Export IPA
      working-directory: ios/App
      run: |
        xcodebuild -exportArchive \
          -archivePath build/App.xcarchive \
          -exportPath build \
          -exportOptionsPlist ExportOptions.plist \
          -allowProvisioningUpdates
    
    - name: Find IPA file
      id: find-ipa
      working-directory: ios/App
      run: |
        IPA_FILE=$(find build -name "*.ipa" | head -1)
        echo "ipa_path=$IPA_FILE" >> $GITHUB_OUTPUT
        echo "Found IPA: $IPA_FILE"
    
    - name: Copy IPA to releases folder
      run: |
        mkdir -p releases
        cp ios/App/build/*.ipa releases/danai-task-manager-ios.ipa || true
        ls -lh releases/
    
    - name: Upload IPA as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa
        path: ios/App/build/*.ipa
        retention-days: 30
    
    - name: Upload to releases folder
      if: github.event_name == 'push'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add releases/danai-task-manager-ios.ipa
        git commit -m "Add iOS IPA build [skip ci]" || exit 0
        git push origin main || exit 0
    
    - name: Create Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          releases/danai-task-manager-ios.ipa
          releases/danai-task-manager-android.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

