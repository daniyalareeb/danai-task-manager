name: Build Android App

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - 'android/**'
      - 'package.json'
      - 'capacitor.config.ts'
  release:
    types: [created]

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Verify Node.js version
      run: |
        node --version
        npm --version
        echo "Node.js version check passed"
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build web assets
      run: npm run build:web
    
    - name: Sync Capacitor
      run: npx cap sync android
    
    - name: Build Android APK
      working-directory: android
      run: |
        ./gradlew assembleDebug
    
    - name: Copy APK to releases folder
      run: |
        mkdir -p releases
        cp android/app/build/outputs/apk/debug/app-debug.apk releases/danai-task-manager-android.apk
        ls -lh releases/
    
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    
    - name: Upload to releases folder
      if: github.event_name == 'push'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add releases/danai-task-manager-android.apk
        git commit -m "Add Android APK build [skip ci]" || exit 0
        git push origin main || exit 0
    
    - name: Create Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          releases/danai-task-manager-android.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

